# Publishes OMNI as a public website on GitHub Pages.
# It runs whenever the code changes, and after each crawl so the newest
# UNNC news and events go live too.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Publish website
on:
  push:
    branches: [claude/project-thread-oqbjhd]
  workflow_run:
    workflows: ["Update live UNNC data"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/project-thread-oqbjhd
      - name: Check the app
        run: node --test tests/*.test.js
      - name: Collect the website files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest css js data icons _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
