# Every 30 minutes, read UNNC's public news and events pages and save them
# to data/live.json. If anything changed, commit it so the live site updates.
name: Update live UNNC data
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_feed:
        description: "To try an RSS feed without saving anything, paste its link here. Leave empty for a normal update."
        required: false
        default: ""
      probe_page:
        description: "For developers: show how a UNNC page is built (nothing is saved)."
        required: false
        default: ""
      discover:
        description: "For developers: list news/event links on these pages, or 'default' (nothing is saved)."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Look at a page (nothing is saved)
        if: ${{ inputs.probe_page != '' && inputs.probe_page != null }}
        env:
          PAGE: ${{ inputs.probe_page }}
        run: for u in $PAGE; do echo "===== $u"; node tools/crawl.js --probe "$u" || true; sleep 2; done
      - name: Find sources (nothing is saved)
        if: ${{ inputs.discover != '' && inputs.discover != null }}
        env:
          SEEDS: ${{ inputs.discover }}
        run: |
          # Several jobs can be given, separated by ";". Each is "default", "--raw <url>", "--try <source or url> [pattern]" or a list of urls.
          IFS=';' read -ra JOBS <<< "$SEEDS"
          for J in "${JOBS[@]}"; do
            J="$(echo "$J" | xargs)"
            echo "########## $J"
            case "$J" in
              default) node tools/discover.js || true ;;
              --raw*) node tools/discover.js --raw ${J#--raw } || true ;;
              --try*) node tools/crawl.js --try ${J#--try } || true ;;
              *) node tools/discover.js $J || true ;;
            esac
            sleep 1
          done
      - name: Try a feed (nothing is saved)
        if: ${{ inputs.test_feed != '' && inputs.test_feed != null }}
        env:
          FEED: ${{ inputs.test_feed }}
        run: node tools/crawl.js --test-feed "$FEED"
      - name: Read UNNC pages
        if: ${{ (inputs.test_feed == '' || inputs.test_feed == null) && (inputs.probe_page == '' || inputs.probe_page == null) && (inputs.discover == '' || inputs.discover == null) }}
        run: node tools/crawl.js
      - name: Save changes
        if: ${{ (inputs.test_feed == '' || inputs.test_feed == null) && (inputs.probe_page == '' || inputs.probe_page == null) && (inputs.discover == '' || inputs.discover == null) }}
        run: |
          if [ -z "$(git status --porcelain -- data/live.json)" ]; then
            echo "No new news or events."
            exit 0
          fi
          git config user.name "omni-crawler"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit -m "Update live UNNC news and events"
          git push
